<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>貪食蛇</title>
<style>
  :root {
    --bg: #14232a;
    --board: #1b3a3f;
    --board-alt: #1f4046;
    --snake: #9be15d;
    --snake-dark: #5fb83a;
    --food: #ff6b4a;
    --text: #e8f1e4;
    --muted: #8fb0a8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 12px; user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: .15em; }
  .bar { display: flex; gap: 20px; align-items: center; font-size: 1rem; color: var(--muted); }
  .bar b { color: var(--text); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
  .wrap { position: relative; width: min(92vw, 420px); }
  canvas { width: 100%; height: auto; display: block; border-radius: 10px; background: var(--board); touch-action: none; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; background: rgba(20,35,42,.78); border-radius: 10px; text-align: center; padding: 16px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0; font-size: 1.5rem; }
  .overlay p { margin: 0; color: var(--muted); line-height: 1.5; }
  button {
    font: inherit; color: var(--bg); background: var(--snake); border: 0; border-radius: 8px;
    padding: 10px 22px; cursor: pointer; font-weight: 700;
  }
  button:hover { background: #b3f27a; }
  button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--muted); font-weight: 500; padding: 6px 14px; }
  button.ghost:hover { background: rgba(255,255,255,.08); }
  .row { display: flex; gap: 10px; }
  .pad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 56px); gap: 8px; }
  .pad button { padding: 0; font-size: 1.4rem; background: var(--board-alt); color: var(--text); border: 1px solid #2c5a60; }
  .pad button:active { background: var(--snake-dark); }
  .pad .up { grid-column: 2; grid-row: 1; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 2; }
  .pad .right { grid-column: 3; grid-row: 2; }
  .hint { color: var(--muted); font-size: .85rem; }
  @media (hover: hover) and (pointer: fine) { .pad { display: none; } }
</style>
</head>
<body>
  <h1>貪食蛇</h1>
  <div class="bar">
    <span>分數 <b id="score">0</b></span>
    <span>最高分 <b id="best">0</b></span>
    <span>長度 <b id="len">3</b></span>
  </div>

  <div class="wrap">
    <canvas id="c" width="400" height="400" aria-label="遊戲畫面"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">準備好了嗎？</h2>
      <p id="ovText">方向鍵或 WASD 移動<br>空白鍵暫停<br>手機可滑動畫面控制</p>
      <button id="startBtn">開始遊戲</button>
    </div>
  </div>

  <div class="row">
    <button class="ghost" id="wrapBtn" aria-pressed="false">穿牆：關</button>
    <button class="ghost" id="pauseBtn">暫停</button>
  </div>

  <div class="pad" aria-label="方向按鈕">
    <button class="up" data-d="U" aria-label="上">▲</button>
    <button class="left" data-d="L" aria-label="左">◀</button>
    <button class="down" data-d="D" aria-label="下">▼</button>
    <button class="right" data-d="R" aria-label="右">▶</button>
  </div>
  <div class="hint">吃越多越快，小心別撞到自己</div>

<script>
(() => {
  const N = 20, CELL = 20;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const scoreEl = $('score'), bestEl = $('best'), lenEl = $('len');
  const overlay = $('overlay'), ovTitle = $('ovTitle'), ovText = $('ovText');
  const startBtn = $('startBtn'), wrapBtn = $('wrapBtn'), pauseBtn = $('pauseBtn');

  const DIRS = { U: [0,-1], D: [0,1], L: [-1,0], R: [1,0] };
  const OPP = { U:'D', D:'U', L:'R', R:'L' };

  let snake, dir, queue, food, score, state = 'ready', timer = null, wrapWalls = false;
  let best = 0;
  try { best = +localStorage.getItem('snake-best') || 0; } catch (e) {}
  bestEl.textContent = best;

  function reset() {
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = 'R'; queue = []; score = 0;
    placeFood(); updateHud(); draw();
  }

  function placeFood() {
    const free = [];
    for (let x = 0; x < N; x++) for (let y = 0; y < N; y++)
      if (!snake.some(s => s.x === x && s.y === y)) free.push({x,y});
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function updateHud() {
    scoreEl.textContent = score;
    lenEl.textContent = snake.length;
    bestEl.textContent = best;
  }

  function speed() { return Math.max(65, 140 - score * 3); }

  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(() => { tick(); if (state === 'running') schedule(); }, speed());
  }

  function showOverlay(title, text, btn) {
    ovTitle.textContent = title; ovText.innerHTML = text; startBtn.textContent = btn;
    overlay.classList.remove('hidden');
  }

  function start() {
    if (state === 'over' || state === 'ready') reset();
    state = 'running';
    overlay.classList.add('hidden');
    pauseBtn.textContent = '暫停';
    schedule();
  }

  function pause() {
    if (state === 'running') {
      state = 'paused'; clearTimeout(timer);
      pauseBtn.textContent = '繼續';
      showOverlay('已暫停', '按空白鍵或按鈕繼續', '繼續');
    } else if (state === 'paused') start();
  }

  function gameOver() {
    state = 'over'; clearTimeout(timer);
    if (score > best) {
      best = score;
      try { localStorage.setItem('snake-best', best); } catch (e) {}
    }
    updateHud();
    showOverlay('遊戲結束', `你的分數：${score}<br>最高分：${best}`, '再玩一次');
  }

  function tick() {
    if (queue.length) {
      const nd = queue.shift();
      if (nd !== OPP[dir]) dir = nd;
    }
    const [dx, dy] = DIRS[dir];
    let nx = snake[0].x + dx, ny = snake[0].y + dy;
    if (wrapWalls) { nx = (nx + N) % N; ny = (ny + N) % N; }
    else if (nx < 0 || ny < 0 || nx >= N || ny >= N) return gameOver();

    const eating = food && nx === food.x && ny === food.y;
    const body = eating ? snake : snake.slice(0, -1); // tail moves away if not eating
    if (body.some(s => s.x === nx && s.y === ny)) return gameOver();

    snake.unshift({x:nx, y:ny});
    if (eating) {
      score += 1;
      if (score > best) best = score;
      placeFood();
      if (!food) { updateHud(); draw(); state = 'over'; showOverlay('你贏了！', '整個棋盤都被你吃滿了', '再玩一次'); return; }
    } else snake.pop();
    updateHud(); draw();
  }

  function turn(d) {
    if (state === 'ready' || state === 'over') { start(); }
    if (state !== 'running') return;
    const last = queue.length ? queue[queue.length-1] : dir;
    if (d !== last && d !== OPP[last] && queue.length < 3) queue.push(d);
  }

  function rr(x, y, w, h, r) {
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
  }

  function draw() {
    const css = getComputedStyle(document.documentElement);
    const c = k => css.getPropertyValue(k).trim();
    for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) {
      ctx.fillStyle = (x + y) % 2 ? c('--board-alt') : c('--board');
      ctx.fillRect(x*CELL, y*CELL, CELL, CELL);
    }
    if (food) {
      ctx.fillStyle = c('--food');
      ctx.beginPath(); ctx.arc(food.x*CELL + CELL/2, food.y*CELL + CELL/2 + 1, CELL*0.36, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = c('--snake-dark');
      rr(food.x*CELL + CELL/2 - 1, food.y*CELL + 1, 3, 5, 1);
    }
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? c('--snake') : (i % 2 ? c('--snake-dark') : '#74c94a');
      rr(s.x*CELL + 1, s.y*CELL + 1, CELL - 2, CELL - 2, i === 0 ? 7 : 5);
    });
    // eyes
    const h = snake[0], [dx, dy] = DIRS[dir];
    const cx = h.x*CELL + CELL/2, cy = h.y*CELL + CELL/2;
    const px = -dy, py = dx; // perpendicular
    ctx.fillStyle = '#14232a';
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(cx + dx*4 + px*4*side, cy + dy*4 + py*4*side, 2, 0, Math.PI*2);
      ctx.fill();
    }
  }

  // keyboard
  const KEYS = { ArrowUp:'U', ArrowDown:'D', ArrowLeft:'L', ArrowRight:'R', w:'U', s:'D', a:'L', d:'R', W:'U', S:'D', A:'L', D:'R' };
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); (state === 'running' || state === 'paused') ? pause() : start(); return; }
    if (KEYS[e.key]) { e.preventDefault(); turn(KEYS[e.key]); }
  });

  // swipe
  let t0 = null;
  cv.addEventListener('touchstart', e => { const t = e.touches[0]; t0 = {x:t.clientX, y:t.clientY}; }, {passive:true});
  cv.addEventListener('touchend', e => {
    if (!t0) return;
    const t = e.changedTouches[0], dx = t.clientX - t0.x, dy = t.clientY - t0.y;
    t0 = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
  }, {passive:true});

  // buttons
  document.querySelectorAll('.pad button').forEach(b => b.addEventListener('click', () => turn(b.dataset.d)));
  startBtn.addEventListener('click', start);
  pauseBtn.addEventListener('click', () => (state === 'running' || state === 'paused') ? pause() : start());
  wrapBtn.addEventListener('click', () => {
    if (state === 'running') return;
    wrapWalls = !wrapWalls;
    wrapBtn.textContent = '穿牆：' + (wrapWalls ? '開' : '關');
    wrapBtn.setAttribute('aria-pressed', wrapWalls);
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'running') pause(); });

  reset();
})();
</script>
</body>
</html>
